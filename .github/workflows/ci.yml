name: ci

# Deprecated automation surface: `make ci` is the canonical gate. This
# compatibility workflow is intentionally manual-only.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - run: make ci
